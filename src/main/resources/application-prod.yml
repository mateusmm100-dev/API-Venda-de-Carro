spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

gateway:
  # Sem valor padrão: a aplicação não sobe em produção sem o segredo.
  shared-secret: ${GATEWAY_SHARED_SECRET}
