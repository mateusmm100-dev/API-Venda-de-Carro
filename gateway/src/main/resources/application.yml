server:
  port: ${PORT:8000}

spring:
  application:
    name: locadora-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          # Emissor dos tokens: o mesmo endereço que o gateway usa para falar com o Keycloak.
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:locadora}
  cloud:
    gateway:
      routes:
        - id: backend-locadora
          uri: ${BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/carros/**,/alugueis/**,/usuarios/**

keycloak:
  base-url: ${KEYCLOAK_URL:http://localhost:8180}
  realm: ${KEYCLOAK_REALM:locadora}
  client-id: ${KEYCLOAK_CLIENT_ID:locadora-api}
  admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:gateway-admin}
  # Em produção, troque no Keycloak e defina esta variável. O valor padrão é só para desenvolvimento.
  admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:dev-gateway-admin-secret}

gateway:
  # Mesmo valor de GATEWAY_SHARED_SECRET do backend.
  shared-secret: ${GATEWAY_SHARED_SECRET:dev-secret-troque-em-producao}

ratelimit:
  auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:5}
  api-per-minute: ${RATE_LIMIT_API_PER_MINUTE:60}
  # Só ligue atrás de um proxy confiável (Render, Railway...), senão o X-Forwarded-For pode ser forjado.
  trust-forwarded-for: ${RATE_LIMIT_TRUST_XFF:false}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

management:
  endpoints:
    web:
      exposure:
        include: health
